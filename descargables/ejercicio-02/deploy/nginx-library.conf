server {
    listen 80;
    server_name _;

    # Punto de entrada público exigido por el ejercicio: /library
    location /library/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /library {
        return 301 /library/;
    }

    # Catch-all: la app genera enlaces, redirecciones e imágenes con rutas
    # absolutas desde la raíz (/libros, /css/..., /uploads/...). Este bloque
    # asegura que esas rutas también lleguen al mismo backend, sin tener que
    # reescribir la aplicación para que conozca el prefijo /library.
    location / {
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
